name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build (type-check + static build)
        run: npm run build
      - name: Verify built output
        run: npm test
